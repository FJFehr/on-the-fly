paper:
  title: "On-the-fly Weight Generation: A Hypernetwork Proof of Concept on ARC-1D"
  short_title: "On-the-fly Weights"          # nav wordmark + browser tab title; keep brief
  wordmark_logo: assets/favicon.svg          # optional graphic after the nav wordmark
  description: "On ARC-1D, a single hypernetwork generates the weights of tiny task-specific models from a few examples. The weights form a structured space, and the models partially generalise to compositions and transformations not seen during training."
  year: 2026
  venue:                               # a plain string, or a map like this one
    label: "Workshop (🔦 Spotlight)"
    title: "Spotlight at the NeurIPS 2026 Workshop on Neural Network Artifacts as a New Data Modality"
    url: https://artifactsasdata.org/
    logo: assets/logos/neurips.svg
    logo_dark: assets/logos/neurips-dark.svg
  doi: null
  arxiv: "2610.00820"

# One entry drives the hero, <title>, OpenGraph/Twitter/Scholar meta, and
# citation UI. See docs/01-principles.md #2.
resources:
  openreview: https://openreview.net/forum?id=7sT5TngD0m
  code: https://github.com/FJFehr/on-the-fly-models
  contact: mailto:fabiofehr96@gmail.com
  # Add more buttons as you need them, for example:
  #   paper: https://...                 # PDF or venue page
  #   dataset: https://huggingface.co/datasets/...
  #   demo: https://...
  #   slides: https://...
  #   contact: mailto:you@example.com    # email pill
  # Any other key still gets a button, with a generic link icon. A null value
  # shows a greyed-out button, so delete the line if you don't want one.

social:
  # Link-preview card for X, LinkedIn, Slack and others: a 1200x630 PNG (they do not show SVG).
  # Its source is assets/og-image.svg; after editing that, open it in a browser at 1200x630,
  # screenshot it to assets/og-image.png, and keep the og:image tags in index.html in step.
  image: assets/og-image.png
  favicon: assets/favicon.svg          # 3x3 tile grid
  canonical_url: https://fabiojfehr.com/on-the-fly/

theme:
  palette: mysterious_primary          # "teal" | "sage" | "gold" | "mysterious_primary" (see template/js/palettes.js)
  # Optional CSS custom-property overrides, one per indented line, e.g.
  #   --font-serif: "Georgia", serif
  overrides:
    --affiliation-logo-height: 76px
    --section-title-align: center
    --prose-text-align: justify
    --prose-hyphens: auto

footer:
  note: null                           # optional plain string, renders as-is (no Markdown)

# sections[].blocks[] is render order within that section. Reorder, add, or
# remove either freely, no engine edit needed. The structure below keeps one
# section per demo section so every block type stays demonstrated; see
# docs/03-component-vocabulary.md for the full list.
sections:
  - id: teaser
    nav_title: Overview                  # nav link to the TL;DR; no heading shown
    nav: true
    blocks:
      - type: callout
        style: tldr
        source: content/tldr.md
      - type: figure
        title: Generating Model Weights from Examples
        # The animation plays once (play_ms), then fades to the still of the whole diagram, and
        # replays when the theme changes. Animated WebP, not GIF: GIF transparency is on/off
        # only, which leaves ragged glyph edges. Everything is rebuilt from the draw.io SVG by
        # figure-src/render_focus.mjs (next to this repo), which also prints play_ms.
        src: assets/figures/hypernetworks-focus.webp
        src_dark: assets/figures/hypernetworks-focus-dark.webp
        still: assets/figures/hypernetworks-full.png
        still_dark: assets/figures/hypernetworks-full-dark.png
        play_ms: 19900
        alt: "The hypernetwork encodes the three example pairs into a task vector, decodes it into the weights of a small Transformer, and that Transformer predicts the output for a new input."
        caption: 'An encoder $\phi_\omega$ maps the three support set examples $Z_{\mathcal E}$ to a task vector $z_{\mathcal E}$. A decoder $\psi_\rho$ turns $z_{\mathcal E}$ into every weight $w_{\mathcal E}$ of a small Transformer $f(\cdot;w_{\mathcal E})$. Once generated, $f$ is decoupled and needs no examples: given a new query input $x^\prime$, it predicts the output $\hat y^\prime$.'
        position: center
      - type: takeaways
        title: Key Findings
        source: content/takeaways.yaml

  - id: motivation
    title: Motivation
    nav: false
    blocks:
      - type: markdown
        source: content/motivation.md
      - type: markdown
        source: content/data.md
      # Example episode with a menu of all 14 transformations (demo/demo.js draws it from the
      # demo's preset episodes). `task` is the one shown first; {task} in the caption is replaced
      # by the chosen transformation's name.
      - type: custom
        scripts:
          - demo/demo.js
        stylesheet: demo/demo.css
        render: renderOnTheFlyEpisode
        weights: demo/weights.json
        task: flip
        caption: '**{task}: an example episode.** The support set $Z_{\mathcal E}$ specifies the transformation, which is applied to the query input in $Z^\prime_{\mathcal E}$.'
      - type: markdown
        source: content/data-metric.md

  - id: demo
    title: Generate Models in Your Browser
    nav_title: Demo
    nav: true
    blocks:
      - type: markdown
        source: content/demo.md
      - type: custom
        scripts:
          - demo/hypernet.js
          - demo/demo.js
        stylesheet: demo/demo.css
        render: renderOnTheFlyDemo
        weights: demo/weights.json

  - id: capacity
    title: "1. Specialised Models Require Less Capacity"   # numbered like its Key Findings card (content/takeaways.yaml)
    nav_title: Results
    nav: true
    blocks:
      - type: markdown
        source: content/capacity.md
      - type: figure
        src: assets/figures/capacity-cliff.png
        alt: "Exact-match accuracy against parameter count. Individually trained models reach about 99% with 2.4K parameters, while jointly trained models, with or without task ID, need far more parameters to catch up."
        caption: "**Specialisation requires less capacity.** *Individual*: one model per transformation, averaged over the 14. *Joint*: one model to rule them all ![](assets/icons/eye-tower.svg), with or without a task-ID embedding. Bands show ±1 s.d. across 5 seeds."
        position: center
        width: 60%
      - type: markdown
        source: content/capacity-discussion.md

  - id: generation
    title: "2. Generating Specialised Models with Hypernetworks"   # numbered like its Key Findings card (content/takeaways.yaml)
    nav: false
    blocks:
      - type: markdown
        source: content/generation.md
      - type: figure
        src: assets/figures/hypernet-per-task.png
        alt: "Bar chart of per-transformation exact-match accuracy for individually trained models and hypernetwork-generated models with and without task IDs. Generated models are close to individual models on most transformations."
        caption: "**Generated models approach the accuracy of individually trained ones.** Per-transformation exact-match validation accuracy at 1.4K parameters. Error bars show ±1 s.d. across 5 seeds."
        position: center
      - type: markdown
        source: content/generation-reuse.md
      - type: figure
        src: assets/figures/weight-space-tsne.png
        alt: "Two t-SNE maps of generated models, coloured by transformation. With a task ID each transformation forms its own cluster. Without it, clusters remain but related transformations such as the Move variants overlap."
        caption: "**Generated weights form a task-structured space.** t-SNE of the task vectors from which the weights are generated, coloured by transformation. *Task ID*: transformations are fully separable (100% linear-probe accuracy). *w/o Task ID*: structure emerges from the support examples alone (60.9%)."
        position: center
      - type: markdown
        source: content/generation-space.md

  - id: generalisation
    title: "3. Towards Generalisation with Hypernetworks"   # numbered like its Key Findings card (content/takeaways.yaml)
    nav: false
    blocks:
      - type: markdown
        source: content/generalisation.md
      # Example episode with a menu of the 10 held-out compositions: the same figure as in the
      # Motivation section, fed by demo/compositions.json (rebuilt by demo/export_compositions.py).
      # A ∘ B means B first, then A: {first} is the part applied first, {second} the one after it.
      - type: custom
        scripts:
          - demo/demo.js
        stylesheet: demo/demo.css
        render: renderOnTheFlyEpisode
        weights: demo/compositions.json
        task: fill_mirror
        menu_label: "Composition:"
        caption: "**{task}: an example held-out composition.** The support pairs specify *{first}* followed by *{second}*."
      - type: markdown
        source: content/generalisation-unseen.md
      - type: table
        source: content/generalisation-table.md
        caption: "**Task-ID conditioning improves in-distribution specialisation but hinders generalisation.** Mean ± s.d. over 5 seeds; parentheses show the change from removing the task ID."
      - type: markdown
        source: content/generalisation-discussion.md

  - id: ablations
    title: Additional Analysis
    nav: false
    blocks:
      - type: markdown
        source: content/findings.md
      - type: figure_row
        figures:
          - id: ablation-canon
            src: assets/figures/ablation-canon.png
            alt: "Exact-match accuracy against parameter count with and without Canon layers, for individual models and joint models with and without task ID. Canon layers improve every setting, most at low capacity."
            caption: "**Canon layers are helpful when capacity is limited.**"
          - id: ablation-muon
            src: assets/figures/ablation-muon.png
            alt: "Exact-match accuracy against parameter count with Muon and with AdamW, for individual models and joint models with and without task ID. Muon matches or exceeds AdamW in every setting."
            caption: "**Muon matches or exceeds AdamW.**"

  - id: discussion
    title: A Future Where Models Generate Models
    nav_title: Future
    nav: true
    blocks:
      - type: markdown
        source: content/going-beyond.md

  - id: cite
    title: Citation (BibTeX)
    nav_title: Cite                      # optional shorter nav label
    nav: true
    blocks:
      - type: citation
        source: citation.bib
        note: "Accepted as a 🔦 **spotlight** paper at the [NeurIPS 2026 Workshop on Neural Network Artifacts as a New Data Modality](https://artifactsasdata.org/)."
