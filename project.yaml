paper:
  title: "On-the-fly Weight Generation: A Hypernetwork Proof of Concept on ARC-1D"
  short_title: "On-the-fly Weights"          # nav wordmark + browser tab title; keep brief
  wordmark_logo: assets/favicon-fly.svg      # optional graphic after the nav wordmark
  wordmark_logo_dark: assets/favicon-fly-dark.svg   # optional; shown instead in dark mode
  description: "A hypernetwork reads three examples of a task and writes all the weights of a tiny Transformer that solves it. On ARC-1D, few-shot context can be compiled on the fly into compact, executable model parameters."
  year: 2026
  venue:                               # a plain string, or a map like this one
    label: "Workshop (🔦 Spotlight)"
    title: "Spotlight at the NeurIPS 2026 Workshop on Neural Network Artifacts as a New Data Modality"
    url: https://artifactsasdata.org/
    logo: assets/logos/neurips.svg
    logo_dark: assets/logos/neurips-dark.svg
  doi: null
  arxiv: "2610.00820"

# One entry drives the hero, <title>, OpenGraph/Twitter/Scholar meta, and
# citation UI. See docs/01-principles.md #2.
resources:
  code: https://github.com/FJFehr/on-the-fly-models
  contact: mailto:fabiofehr96@gmail.com
  # Add more buttons as you need them, for example:
  #   paper: https://...                 # PDF or venue page
  #   dataset: https://huggingface.co/datasets/...
