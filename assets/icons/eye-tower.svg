<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 28">
  <defs>
    <!-- Mid-tone tower so it reads on both the light and the dark theme. -->
    <linearGradient id="stone" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8d86a0"/>
      <stop offset="1" stop-color="#565068"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="12" cy="6.2" r="7.5">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#ff7a1a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" gradientUnits="userSpaceOnUse" cx="12" cy="6.2" r="6.4">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.3" stop-color="#ffd23f"/>
      <stop offset="0.65" stop-color="#ff8a1c"/>
      <stop offset="1" stop-color="#d8320c"/>
    </radialGradient>
  </defs>

  <!-- Tower: two horns cradling the eye, a tapered shaft and a spiked base. -->
  <path fill="url(#stone)" d="M3.4 27.5 L5.6 25.2 L4.3 23.4 L6.9 23.8 L8.6 13 Q4.6 7.5 3.6 0.4 Q6.6 6.4 9.8 10.4 Q12 11.6 14.2 10.4 Q17.4 6.4 20.4 0.4 Q19.4 7.5 15.4 13 L17.1 23.8 L19.7 23.4 L18.4 25.2 L20.6 27.5 Z"/>
  <!-- Bladed collars. -->
  <path fill="#4b455b" d="M6.6 12.6 H17.4 L15.8 14.4 H8.2 Z M5.8 18.9 H18.2 L16.9 20.8 H7.1 Z"/>
  <!-- Lit windows and gate. -->
  <path fill="#ffb347" d="M11.65 15.9 a.35 .35 0 0 1 .7 0 v1.7 h-.7 Z M10.2 22 h.6 v1.5 h-.6 Z M13.2 22 h.6 v1.5 h-.6 Z M10.9 27.5 V25.7 Q12 24.1 13.1 25.7 V27.5 Z"/>

  <!-- Eye: halo, flames, iris, ember ring, slit pupil. -->
  <circle cx="12" cy="6.2" r="7.5" fill="url(#glow)"/>
  <path fill="#e8430f" d="M4.4 6.2 Q7 3.9 8.4 3.5 L9 1.5 L10.3 2.9 L12.3 0.3 L13.6 2.8 L15.4 1.3 L15.7 3.5 Q17.4 4.2 19.6 6.2 Q12 14.4 4.4 6.2 Z"/>
  <path fill="url(#iris)" d="M5.8 6.2 Q12 -0.6 18.2 6.2 Q12 13 5.8 6.2 Z"/>
  <path fill="#e2400f" fill-opacity="0.65" d="M12 2.9 Q14.4 6.2 12 9.5 Q9.6 6.2 12 2.9 Z"/>
  <path fill="#1a0a12" d="M12 2.9 Q13.3 6.2 12 9.5 Q10.7 6.2 12 2.9 Z"/>
</svg>
