  <title id="ogSquareTitle">A hypernetwork turns three example pairs into the weights of a small model.</title>
  <rect width="1200" height="1200" fill="#F0ECE3"/>
  <!-- The left 1904 x 901 of the hero diagram (everything up to the weights' label), 1140 wide. -->
  <svg x="30" y="330.3" width="1140" height="539.5" viewBox="12 84 1904 901">
    <image href="figures/hypernetworks-full.png" width="2716" height="988"/>
  </svg>
</svg>
