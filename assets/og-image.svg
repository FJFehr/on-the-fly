<!-- Source of the wide link-preview card, assets/og-image.png (1200x630): the whole hero
     diagram, no text. X and LinkedIn show this shape. They do not show SVG previews, so the
     page's meta tags point at the PNG. To rebuild it, open this file in a browser at 1200x630
     and take a screenshot (see project.yaml, social:). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ogTitle">
  <title id="ogTitle">A hypernetwork turns three example pairs into the weights of a small model, which then predicts the output for a new input.</title>
  <rect width="1200" height="630" fill="#F0ECE3"/>
  <!-- The page's hero diagram: 2716 x 988, shown 1120 wide. -->
  <image href="figures/hypernetworks-full.png" x="40" y="111" width="1120" height="407.4"/>
</svg>
